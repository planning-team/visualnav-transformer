project_name: egowalk_vint_text  # My W&B project name
run_name: vint-text-siglip2

# training setup
use_wandb: True
train: True
batch_size: 4  # Small batch for RTX 2060 6GB VRAM
eval_batch_size: 4
epochs: 50
gpu_ids: [0]
num_workers: 0  # Single-threaded to avoid pickle error
lr: 1e-4  # Lower LR for fine-tuning
optimizer: adamw
clipping: True
max_norm: 1.0
scheduler: "cosine"
warmup: True
warmup_epochs: 2
seed: 0

# Memory optimization
gradient_accumulation_steps: 8  # Effective batch size = 4 * 8 = 32

# model params
model_type: vint_text
obs_encoder: "efficientnet-b0"
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4

# SigLIP2 text encoder config
siglip_model_name: "google/siglip2-base-patch16-224"
siglip_cache_dir: "/workspace/cache/siglip2"  # Docker path - stored on external HDD
freeze_siglip: True  # Freeze SigLIP2 weights

# Pre-trained ViNT checkpoint (set to path of your trained ViNT model)
# If empty, will train from scratch (not recommended)
load_vint_checkpoint: ""  # e.g., "logs/vint-release/vint-5c/latest.pth"
freeze_vint: True  # Freeze ViNT backbone (recommended for fine-tuning)

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 5

# action output params
len_traj_pred: 5
learn_angle: True

# dataset specific parameters
image_size: [85, 64]  # width, height
goal_type: "text"

# EgoWalk text dataset config
egowalk_text:
  # Path to egowalk-dataset library (Docker path)
  egowalk_lib_path: "/workspace/egowalk-dataset"
  # Path to EgoWalk data (Docker path - HF_EGOWALK_HOME)
  data_path: "/workspace/data"
  # Caption type: "normal" (detailed) or "brief" (keywords)
  caption_type: "normal"
  # Trajectories to use (null for all available)
  trajectories:
    - "2024_08_15__19_55_49"
    - "2024_12_10__20_17_45"
  # Indexing parameters
  window_step: 2
  n_window_steps: 4
  context_step: 1
  action_step: 1
  # Number of workers for indexing
  n_index_workers: 0  # Single-threaded to avoid pickle error

# Train/test split (fraction of data for training)
train_fraction: 0.8

# logging
print_log_freq: 50
image_log_freq: 500
num_images_log: 4
eval_fraction: 0.5
wandb_log_freq: 10
eval_freq: 1

# wandb entity (your username)
wandb_entity: "medfa"
